<svg width="180" height="180" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bürolist App-Icon (Android Home-Screen / PWA / Apple Touch Icon).
       Volle Flaeche bis zum Rand (kein transparenter Rand, den Android/iOS
       sonst selbst auffuellen wuerden) + "Zeit-B" zentriert innerhalb der
       "Safe Zone" fuer adaptive Icons (~62% Durchmesser, damit rundes/eckiges
       Masking durch den Launcher nichts abschneidet). -->
  <rect width="100" height="100" fill="#1b2126"/>
  <g transform="translate(50,50) scale(0.62) translate(-53,-50)">
    <g fill="none" stroke="#86a9c4" stroke-width="14">
      <path d="M25 10V90"/>
      <path d="M18 17H62V44H25"/>
      <path d="M25 44H62A19.5 19.5 0 0 1 62 83H18"/>
    </g>
    <path d="M62 54V63.5H70" fill="none" stroke="#d3ae7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
